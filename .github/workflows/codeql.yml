name: CodeQL

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Weekly scan so new CodeQL queries run even without pushes
    - cron: '26 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # Dependency cache only. The Gradle *build* cache is disabled for the
      # analysis build below: CodeQL's tracer has to observe real compilations,
      # and a warm build cache makes every compileKotlin task FROM-CACHE, which
      # ends in "CodeQL could not process any code written in Java/Kotlin".
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-read-only: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      # Kotlin extraction requires a real compilation; assembleDebug is the
      # cheapest target that compiles every module.
      - name: Build for analysis
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-build-cache --no-configuration-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:java-kotlin'
