name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR/branch cancels the previous run.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compiles every module and publishes the debug APK.
  #
  # The unit-test, Roborazzi screenshot-verification, and lint work that used to
  # live here now run in the dedicated pr-quality.yml gate (jobs unit-tests,
  # screenshot-verification, lint), so they were removed to avoid running them
  # twice on every PR. Only the assemble + APK upload remains here.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      # Pinned to a commit SHA (same pin as wrapper-validation.yml).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ComposeCookBook
          path: app/build/outputs/apk/debug/*.apk

  # Branch protection on master requires a status check literally named
  # "Building the APK" — that was the job name in the old build.yml, which
  # this PR removed as a duplicate of the `build` job above. Keeping this
  # thin job (rather than editing the protected-branch setting) makes the
  # existing rule keep working without re-running assembleDebug a second time.
  building-the-apk:
    name: Building the APK
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Covered by the build job above, which assembles and uploads the debug APK."
